name: joint-ci
on:
  workflow_dispatch:
    inputs:
      report_json:
        description: JSON array of per-repo reports (or {"reports":[...],"joint_id":"..."})
        required: true
      joint_id:
        description: Existing joint id to resume (optional)
        required: false
        default: ""
      dry_run:
        description: "1=dry-run Fake; 0=live GitHub"
        required: false
        default: "0"
  repository_dispatch:
    types: [joint_ci_report]

permissions:
  contents: read
  issues: write
  checks: write
  statuses: write
  actions: write
  pull-requests: read

jobs:
  schedule:
    runs-on: [self-hosted, Linux, X64, grok-box]
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          if [ -f prototype/requirements.txt ]; then
            .venv/bin/pip install -r prototype/requirements.txt
          else
            .venv/bin/pip install PyYAML
          fi
      - name: Run joint scheduler
        env:
          GITHUB_TOKEN: ${{ secrets.JOINT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          JOINT_GH_TOKEN: ${{ secrets.JOINT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          JOINT_OWNER: zhekui-hub
          JOINT_LAB_REPO: joint-ci-lab
          REPORT_JSON: ${{ github.event.inputs.report_json || toJson(github.event.client_payload) }}
          JOINT_ID: ${{ github.event.inputs.joint_id || github.event.client_payload.joint_id || '' }}
          JOINT_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          JOINT_STATUS_FALLBACK: "1"
        run: |
          set -euo pipefail
          PYTHONPATH=prototype/shared:prototype/arsenal .venv/bin/python prototype/arsenal/scheduler.py