name: joint-ci-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r prototype/requirements.txt
      - name: joint_key unit
        working-directory: prototype/shared
        run: python -m unittest test_joint_key.py -v
      - name: scheduler unit
        working-directory: prototype/arsenal
        env:
          PYTHONPATH: ../shared:.
        run: python -m unittest test_scheduler.py -v

  experiments:
    name: e1-e10-local
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r prototype/requirements.txt
      - name: Run E1-E10 and enforce gate
        working-directory: prototype/experiments
        run: |
          python run_local.py --json | tee /tmp/results.json
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/results.json"))
          assert isinstance(data, list), type(data)
          failed = [r for r in data if str(r.get("result", "")).upper() != "PASS"]
          if failed:
              print("FAILED:", [(f.get("id"), f.get("reason")) for f in failed])
              sys.exit(1)
          if len(data) < 10:
              print(f"expected >=10 scenarios, got {len(data)}")
              sys.exit(1)
          print(f"gate ok: {len(data)}/ {len(data)} PASS")
          PY
