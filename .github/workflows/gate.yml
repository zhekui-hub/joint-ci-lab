name: joint-ci-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit-tests
    runs-on: [self-hosted, Linux, X64, grok-box]
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/pip install -r prototype/requirements.txt
      - name: joint_key unit
        working-directory: prototype/shared
        run: ../../.venv/bin/python -m unittest test_joint_key.py -v
      - name: scheduler unit
        working-directory: prototype/arsenal
        env:
          PYTHONPATH: ../shared:.
        run: ../../.venv/bin/python -m unittest test_scheduler.py -v

  experiments:
    name: e1-e10-local
    runs-on: [self-hosted, Linux, X64, grok-box]
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/pip install -r prototype/requirements.txt
      - name: Run E1-E10 and enforce gate
        working-directory: prototype/experiments
        run: |
          ../../.venv/bin/python run_local.py scenario_e1.yaml scenario_e2.yaml scenario_e3.yaml scenario_e4.yaml scenario_e5.yaml scenario_e6.yaml scenario_e7.yaml scenario_e8.yaml scenario_e9.yaml scenario_e10.yaml --json | tee /tmp/results.json
          ../../.venv/bin/python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/results.json"))
          assert isinstance(data, list), type(data)
          failed = [r for r in data if str(r.get("result", "")).upper() != "PASS"]
          if failed:
              print("FAILED:", [(f.get("id"), f.get("reason")) for f in failed])
              sys.exit(1)
          if len(data) < 10:
              print(f"expected >=10 scenarios, got {len(data)}")
              sys.exit(1)
          print(f"gate ok: {len(data)}/{len(data)} PASS")
          PY
