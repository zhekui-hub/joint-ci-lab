name: joint-ci-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

defaults:
  run:
    shell: pwsh

jobs:
  unit:
    name: unit-tests
    runs-on: [self-hosted, local-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        run: |
          python -m venv --system-site-packages .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: joint_key unit
        working-directory: prototype/shared
        run: '& ../../.venv/Scripts/python.exe -m unittest test_joint_key.py -v'
      - name: scheduler unit
        working-directory: prototype/arsenal
        env:
          PYTHONPATH: '../shared;.'
        run: '& ../../.venv/Scripts/python.exe -m unittest test_scheduler.py -v'

  experiments:
    name: e1-e10-local
    runs-on: [self-hosted, local-ci]
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Setup venv
        run: |
          python -m venv --system-site-packages .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: Run all E and F scenarios and enforce gate
        working-directory: prototype/experiments
        run: |
          $output = & ../../.venv/Scripts/python.exe run_local.py --json
          if ($LASTEXITCODE -ne 0) { $output; exit $LASTEXITCODE }
          $results = @($output | ConvertFrom-Json)
          $expected = @(Get-ChildItem scenario_*.yaml).Count
          $failed = @($results | Where-Object { $_.result -ne 'PASS' })
          if ($expected -lt 21 -or $results.Count -ne $expected -or $failed.Count -gt 0) {
            $results | Format-Table id,result,reason
            throw 'Scenario gate failed or scenarios are missing'
          }
          $results | Format-Table id,result
          Write-Output "gate ok: $($results.Count)/$expected PASS"

