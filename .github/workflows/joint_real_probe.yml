name: joint-real-probe
on:
  workflow_dispatch:
    inputs:
      driver_sha: { required: true, type: string }
      synapse_sha: { required: true, type: string }
      sim_sha: { required: true, type: string }
permissions:
  contents: read
jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        env:
          DRIVER_SHA: ${{ inputs.driver_sha }}
          SYNAPSE_SHA: ${{ inputs.synapse_sha }}
          SIM_SHA: ${{ inputs.sim_sha }}
        run: |
          test -n "$DRIVER_SHA"; test -n "$SYNAPSE_SHA"; test -n "$SIM_SHA"
