name: Probe Publisher
on:
  pull_request:
    types: [opened]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Publish a check run for this run's own commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/check-runs" \
            -f name="probe/creator-sha" \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion=success \
            -f external_id="probe:$RUN_ID" \
            -f details_url="https://github.com/$REPO/actions/runs/$RUN_ID" \
            --jq '{id, name, head_sha, suite: .check_suite.id}'
