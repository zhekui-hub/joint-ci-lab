id: F4
name: three_repo_private_failure_isolation
steps:
  - inject_failure: {test_id: pseudo, params: {cards: 16}}
  - create_pr:
      repo: driver
      branch: feature/f4-driver
      ready: true
      schedule: false
      body: CI_MODE=joint
      remote_tests:
        - {id: multirepo_runtest, params: {profile: default}}
        - {id: pseudo, params: {cards: 16}, exclusive_to: driver}
  - create_pr:
      repo: synapse
      branch: feature/f4-synapse
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        DLC_KERNEL_DRIVER_BRANCH=feature/f4-driver
      remote_tests: [{id: multirepo_runtest, params: {profile: default}}]
  - create_pr:
      repo: sim
      branch: feature/f4-sim
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        DLC_KERNEL_DRIVER_BRANCH=feature/f4-driver
      remote_tests: [{id: arc_multirepo, params: {enable_abs_unit: false}}]
  - schedule: {}
  - assert:
      joint_status: succeeded
      dispatch_count: 2
      public_runs: {multirepo_runtest: 1, arc_multirepo: 1}
      checks: {driver: success, synapse: success, sim: success}
