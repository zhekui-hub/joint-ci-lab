id: E8
name: fixed_dep_compat
steps:
  - create_pr:
      repo: synapse
      branch: feature/e8-synapse
      ready: true
      body: |
        CI_MODE=joint
        DLC_KERNEL_DRIVER_BRANCH=feature/e8-driver-tip
      joint_wait: false
      remote_tests:
        - id: multirepo_runtest
          params: {profile: default}
  - assert:
      joint_status: succeeded
      dispatch_count: 1
      public_runs:
        multirepo_runtest: 1
