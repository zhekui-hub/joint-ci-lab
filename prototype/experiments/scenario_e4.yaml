id: E4
name: exclusive_failure_isolation
steps:
  - inject_failure:
      test_id: pseudo
      params: {cards: 16}
  - create_pr:
      repo: driver
      branch: feature/e4-driver
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
      remote_tests:
        - id: multirepo_runtest
          params: {profile: default}
        - id: pseudo
          params: {cards: 16}
          exclusive_to: driver
  - create_pr:
      repo: synapse
      branch: feature/e4-synapse
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        JOINT_WAIT=true
        DLC_KERNEL_DRIVER_BRANCH=feature/e4-driver
      remote_tests:
        - id: multirepo_runtest
          params: {profile: default}
        - id: pseudo
          params: {cards: 4}
  - schedule: {}
  - assert:
      joint_status: succeeded
      public_runs:
        multirepo_runtest: 1
      exclusive_isolation:
        driver: failure
        synapse: success
      checks:
        driver: failure
        synapse: success
