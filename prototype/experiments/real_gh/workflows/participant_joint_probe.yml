name: joint-participant-probe

# Copy this template to .github/workflows/joint-participant-probe.yml in each
# mock repository before exercising P3 against that repository.
on:
  workflow_dispatch:
    inputs:
      driver_sha:
        description: Explicit driver head SHA
        required: true
        type: string
      synapse_sha:
        description: Explicit synapse head SHA
        required: true
        type: string
      sim_sha:
        description: Explicit sim head SHA
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  echo-inputs:
    runs-on: [self-hosted, local-ci]
    steps:
      - name: Assert explicit SHA inputs
        env:
          DRIVER_SHA: ${{ inputs.driver_sha }}
          SYNAPSE_SHA: ${{ inputs.synapse_sha }}
          SIM_SHA: ${{ inputs.sim_sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DRIVER_SHA) -or [string]::IsNullOrWhiteSpace($env:SYNAPSE_SHA) -or [string]::IsNullOrWhiteSpace($env:SIM_SHA)) { exit 1 }
          Write-Output "driver_sha=$env:DRIVER_SHA"
          Write-Output "synapse_sha=$env:SYNAPSE_SHA"
          Write-Output "sim_sha=$env:SIM_SHA"

