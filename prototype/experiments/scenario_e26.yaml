id: E26
name: public_only_ignores_exclusive_mix
steps:
  - inject_failure:
      test_id: pseudo
      params: {cards: 16}
  - create_pr:
      repo: driver
      branch: feature/e26-driver
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
      remote_tests:
        - id: multirepo_runtest
          params: {profile: default}
        - id: pseudo
          params: {cards: 16}
          exclusive_to: driver
        - id: pseudo
          params: {cards: 4}
  - create_pr:
      repo: synapse
      branch: feature/e26-synapse
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        JOINT_WAIT=true
        DLC_KERNEL_DRIVER_BRANCH=feature/e26-driver
      remote_tests:
        - id: multirepo_runtest
          params: {profile: default}
        - id: pseudo
          params: {cards: 4}
  - schedule: {}
  - assert:
      joint_status: succeeded
      public_runs:
        multirepo_runtest: 1
        pseudo: 1
      dispatch_count: 2
      checks:
        driver: success
        synapse: success
