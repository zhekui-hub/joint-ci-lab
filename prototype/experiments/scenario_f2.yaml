id: F2
name: three_repo_staggered_wait
steps:
  - create_pr:
      repo: synapse
      branch: feature/f2-synapse
      ready: true
      body: |
        CI_MODE=joint
        JOINT_WAIT=true
        DLC_KERNEL_DRIVER_BRANCH=feature/f2-driver
        DLC_SIM_BRANCH=feature/f2-sim
      remote_tests: [{id: multirepo_runtest, params: {profile: default}}]
  - assert: {joint_status: waiting_deps, dispatch_count: 0, runner_busy_seconds_max: 0}
  - sleep_minutes: 5
  - create_pr:
      repo: sim
      branch: feature/f2-sim
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        JOINT_WAIT=true
        DLC_KERNEL_DRIVER_BRANCH=feature/f2-driver
      remote_tests: [{id: arc_multirepo, params: {enable_abs_unit: false}}]
  - schedule: {}
  - assert: {joint_status: waiting_deps, dispatch_count: 0, runner_busy_seconds_max: 0}
  - create_pr:
      repo: driver
      branch: feature/f2-driver
      ready: true
      body: CI_MODE=joint
      remote_tests: [{id: multirepo_runtest, params: {profile: default}}]
  - assert:
      joint_status: succeeded
      dispatch_count: 2
      public_runs: {multirepo_runtest: 1, arc_multirepo: 1}
