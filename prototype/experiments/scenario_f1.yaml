id: F1
name: three_repo_public_union
steps:
  - create_pr:
      repo: driver
      branch: feature/f1-driver
      ready: true
      schedule: false
      body: CI_MODE=joint
      remote_tests:
        - {id: multirepo_runtest, params: {profile: default}}
        - {id: pseudo, params: {cards: 16}, exclusive_to: driver}
  - create_pr:
      repo: synapse
      branch: feature/f1-synapse
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        JOINT_WAIT=true
        DLC_KERNEL_DRIVER_BRANCH=feature/f1-driver
      remote_tests:
        - {id: multirepo_runtest, params: {profile: default}}
        - {id: pseudo, params: {cards: 4}}
  - create_pr:
      repo: sim
      branch: feature/f1-sim
      ready: true
      schedule: false
      body: |
        CI_MODE=joint
        JOINT_WAIT=true
        DLC_KERNEL_DRIVER_BRANCH=feature/f1-driver
        DLC_SIM_BRANCH=feature/f1-sim
      remote_tests:
        - {id: multirepo_runtest, params: {profile: default}}
        - {id: arc_multirepo, params: {enable_abs_unit: false}}
  - schedule: {}
  - assert:
      joint_status: succeeded
      dispatch_count: 3
      public_runs: {multirepo_runtest: 1, pseudo: 1, arc_multirepo: 1}
      checks: {driver: success, synapse: success, sim: success}
      merged_test_ids_contains: [multirepo_runtest, pseudo, arc_multirepo]
